name: Build Sketchy APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and build
        run: |
          flutter create --platforms=android --project-name sketchy --org com.sketchy.app build_app
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          cd build_app
          sed -i 's/android:label="[^"]*"/android:label="Sketchy"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sketchy v${{ github.run_number }}
          files: build_app/build/app/outputs/flutter-apk/app-release.apk
